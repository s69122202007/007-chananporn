<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BusLink | เส้นทาง</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8fc;color:#172033}.nav{background:#fff;border-bottom:1px solid #dbe5ef;padding:16px 7%;display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:bold;color:#2563eb}.nav a{margin-left:16px;text-decoration:none;color:#667085}.wrap{max-width:1050px;margin:auto;padding:45px 22px}.tag{color:#2563eb;font-size:12px;font-weight:bold}.panel{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:25px;margin-top:20px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}label{font-size:13px}select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;margin-top:6px}button{background:#2563eb;color:#fff;border:0;cursor:pointer}.result{margin-top:18px;background:#f0f7ff;border-radius:12px;padding:20px}.chip{display:inline-block;background:#fff;border:1px solid #9cc7f2;border-radius:9px;padding:8px;margin:4px;color:#1559a6}.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stop{background:#fff;border:1px solid #dbe5ef;border-radius:12px;padding:16px}.stop b{display:block}.muted{color:#667085;font-size:13px}@media(max-width:700px){.form,.stops{grid-template-columns:1fr}.nav{display:block}.nav a{display:inline-block;margin:10px 8px 0 0}}
</style></head><body><header class="nav"><div class="logo">🚌 BusLink</div><nav><a href="index.html">หน้าแรก</a><a href="routes.html">เส้นทาง</a><a href="graph.html">Graph</a><a href="tree.html">Tree</a></nav></header><main class="wrap"><span class="tag">PAGE 02 · ROUTES</span><h1>ค้นหาเส้นทางรถโดยสาร</h1><p class="muted">เลือกจุดเริ่มต้นและจุดหมาย ระบบจะค้นหา Path ด้วย BFS</p><section class="panel"><div class="form"><label>จุดเริ่มต้น<select id="s"></select></label><label>จุดหมาย<select id="e"></select></label><button onclick="find()">ค้นหาเส้นทาง</button></div><div id="r" class="result">เลือกจุดเริ่มต้นและจุดหมาย แล้วกดค้นหา</div></section><h2>จุดจอดในระบบ</h2><div id="stops" class="stops"></div></main><script>
const g={"สถานีขนส่ง":["ตลาดกลาง","สวนสาธารณะ"],"ตลาดกลาง":["สถานีขนส่ง","โรงเรียน","สถานีรถไฟ"],"สวนสาธารณะ":["สถานีขนส่ง","โรงพยาบาล"],"โรงเรียน":["ตลาดกลาง","สถานีรถไฟ"],"โรงพยาบาล":["สวนสาธารณะ","สถานีรถไฟ"],"สถานีรถไฟ":["ตลาดกลาง","โรงเรียน","โรงพยาบาล","มหาวิทยาลัย"],"มหาวิทยาลัย":["สถานีรถไฟ"]};
const ns=Object.keys(g);ns.forEach(x=>{s.add(new Option(x,x));e.add(new Option(x,x))});s.value="สถานีขนส่ง";e.value="มหาวิทยาลัย";
function bfs(a,b){if(a===b)return[a];let q=[[a]],v=new Set([a]);while(q.length){let p=q.shift(),c=p[p.length-1];for(let n of g[c])if(!v.has(n)){let np=[...p,n];if(n===b)return np;v.add(n);q.push(np)}}return null}
function find(){let p=bfs(s.value,e.value);r.innerHTML=p?'<b>PATH ที่พบ</b><br>'+p.map(x=>'<span class="chip">'+x+'</span>').join(' → ')+'<p class="muted">ผ่าน '+p.length+' Vertex และ '+(p.length-1)+' Edge</p>':'ไม่พบเส้นทาง'}
stops.innerHTML=ns.map((x,i)=>'<div class="stop"><b>'+(i+1)+'. '+x+'</b><span class="muted">'+g[x].length+' จุดเชื่อมต่อ</span></div>').join('');
</script></body></html>
